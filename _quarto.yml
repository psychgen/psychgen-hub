project:
  type: website

language: 
  search-text-placeholder: Search
  
website:
  title: "PsychGen Hub"
  site-url: "https://psychgen.netlify.app"
  description: "PsychGen Website"
  favicon: logo.png
  page-navigation: true
  back-to-top-navigation: true
  search: 
    location: navbar 
    type: textbox
    
  navbar:
    background: primary
    collapse-bellow: lg
    left:
      - text: "News"
        href: news.qmd
      - text: "Wiki"
        href: docs/psychgen_wiki/pipelines.qmd
      - text: "Data dictionary"
        href: docs/data_dictionary
      - text: "psychgenR"
        href: docs/psychgen_wiki/psychgenR.qmd
      - text: "Github"
        href: https://github.com/psychgen
        target: _blank
      - text: "OSF"
        href: https://osf.io/6m9ec/
        target: _blank
    right: 
      - icon: rss
        href: news.xml
    tools:
      - icon: github
        menu: 
          - text: "Source Code"
            href: https://github.com/psychgen/psychgen-website
            target: _blank
            
  sidebar:
    - id: psychgen_wiki
      title: "Wiki"
      align: left
      contents:
        - text: "Pipelines"
          href: docs/psychgen_wiki/pipelines.qmd
        - "---"
        - text: "Onboarding"
          href: docs/psychgen_wiki/onboarding.qmd
        - "---"
        - section: "Starting a project"
          href: docs/psychgen_wiki/start_toc.qmd
          contents:
            - text: "Analysis plan"
              href: docs/psychgen_wiki/analysis_plan.qmd
            - text: "Data dictionary"
              href: docs/data_dictionary/index.qmd
            - text: "Preregistration"
              href: docs/psychgen_wiki/preregistration.qmd
        - "---"
        - section: "Working on a project"
          href: docs/psychgen_wiki/working_toc.qmd
          contents:
            - section: "TSD"
              contents:
                - text: "Basics"
                  href: docs/psychgen_wiki/tsd_gettingstarted.qmd
                - text: "Use abroad"
                  href: docs/psychgen_wiki/access_tsd.qmd
                - text: "Code of conduct"
                  href: docs/psychgen_wiki/data_gettingstarted.qmd
                - section: "Setting up a project"
                  href: docs/psychgen_wiki/analytic_project.qmd
                  contents:
                    - text: "Version control"
                      href: docs/psychgen_wiki/git.qmd
                - text: "HPC"
                  href: docs/psychgen_wiki/using_hpc.qmd
            - section: "Data"
              contents:
                - text: "Documentation"
                  href: docs/psychgen_wiki/datadocumentation.qmd
                - section: "Working with phenotypic data"
                  contents:
                    - text: "Using MoBa questionnaire and linked registry data"
                      href: docs/psychgen_wiki/pheno_data.qmd
                    - section: "Standard covariates MoBa"
                      contents:
                        - text: "The covariate file"
                          href: docs/psychgen_wiki/covariate_file.qmd
                        - text: "Accessing standard covariates via phenotools"
                          href: docs/psychgen_wiki/covariates_phenotools.qmd
                        - text: "Derived covariates: education"
                          href: docs/psychgen_wiki/covariates_edu.qmd
                        - text: "Derived covariates: income"
                          href: docs/psychgen_wiki/covariates_inc.qmd
                    - text: "{phenotools} vignette"
                      href: docs/psychgen_wiki/pheno_vignette.qmd
                - section: "Working with genetic data"
                  contents:
                    - text: "Using MoBa genetic data"
                      href: docs/psychgen_wiki/genetic_data.qmd
                    - text: "{genotools} vignette"
                      href: docs/psychgen_wiki/geno_vignette.qmd
        - "---"
        - section: "Exporting results and publishing"
          href: docs/psychgen_wiki/export_toc.qmd
          contents:
            - section: "Export"
              contents:
                - text: "Principles"
                  href: docs/psychgen_wiki/export_principles.qmd
                - text: "Procedure"
                  href: docs/psychgen_wiki/export_procedure.qmd
                - text: "Make export request"
                  href: docs/psychgen_wiki/export_request.qmd
            - section: "Publication"
              contents:
                - text: "Checklist"
                  href: docs/psychgen_wiki/checklist.qmd
                - text: "Reporting"
                  href: docs/psychgen_wiki/ReportingCristin.qmd
        - "---"
        - text: "Offboarding"
          href: docs/psychgen_wiki/offboarding.qmd
        - "---"
        - section: "Other resources"
          contents: 
            - text: "Logos"
              href: docs/psychgen_wiki/logos.qmd
            - text: "Community resources"
              href: docs/psychgen_wiki/community_res.qmd
          

  page-footer:
    background: light 
    right: This website is built with {{< fa heart title="a heart" >}}, [{{< fa brands r-project title="R Project" >}}](https://www.r-project.org/about.html){target=_blank} and [Quarto](https://quarto.org/){target=_blank}
format:
  html:
    theme: 
      - flatly
      - styles.scss
    toc: true
    page-layout: full
    mainfont: Cabin
    smooth-scroll: true
    grid: 
      sidebar-width: 250px
      body-width: 900px
      margin-width: 300px

editor: visual

execute:
  freeze: auto
